# Corre VatioPlan todos los días a las 6:15 a. m. hora Colombia (11:15 UTC) y guarda en el
# repositorio los datos descargados (data/) y los resultados (salidas/).
# Así el tablero de Streamlit arranca con datos reales aunque SIMEM bloquee la descarga.
# También se puede lanzar a mano (pestaña Actions → Run workflow) o desde n8n.
name: VatioPlan diario

on:
  schedule:
    - cron: "15 11 * * *"        # GitHub usa UTC; puede retrasarse en horas de alta carga
  workflow_dispatch:

permissions:
  contents: write                # para guardar data/ y salidas/ en el repositorio

concurrency:
  group: vatioplan-diario
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el pipeline (datos → ML → reglas → IA) para fábrica y flota
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VATIOPLAN_PAUSA_S: "3"
        run: python -m vatioplan.pipeline

      - name: Verificar que los datos son reales
        run: |
          python -c "import json,sys; e=json.load(open('salidas/estado.json')); print(e); sys.exit(0 if e['fuente']=='REAL' else 1)"

      - name: Guardar datos y resultados en el repositorio
        if: always()
        run: |
          git config user.name "vatioplan-bot"
          git config user.email "vatioplan-bot@users.noreply.github.com"
          git add data || true                       # bloques de SIMEM ya descargados (sirven aunque falle)
          if [ "${{ job.status }}" = "success" ]; then git add salidas; fi   # solo resultados con datos reales
          git diff --cached --quiet || git commit -m "Datos y plan del $(date -u +%F)"
          git push

      - name: Publicar resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salidas-${{ github.run_id }}
          path: salidas/
          retention-days: 14
